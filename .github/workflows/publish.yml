# Publish honesttools to PyPI — on a GitHub Release, via Trusted Publishing (OIDC, no token).
#
# ONE-TIME SETUP (the repo owner, on PyPI) — a single step:
#   pypi.org → Account → Publishing → "Add a pending publisher":
#     PyPI project name : honesttools
#     Owner             : techno-optimist
#     Repository name   : honesttools
#     Workflow filename : publish.yml
#     Environment name  : (leave blank)
#
# TO PUBLISH: create a GitHub Release (tag e.g. v0.1.0). This builds, runs the selftest gate, and
# publishes. No API token is stored anywhere — PyPI trusts this specific repo+workflow via OIDC.
# (For a team, add `environment: pypi` back and require a reviewer for a human approval gate.)
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:      # manual trigger, for a re-publish

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # NEVER publish a build whose own break-test does not pass. Exit 2 (INDISTINGUISHABLE at low
      # seeds) is fine; exit 1 (over-fires, or the planted-separable control did not fire) blocks.
      - name: selftest gate — the tool must catch its own broken input
        run: |
          set +e
          python3 nulltest.py --selftest --seeds 25 --n-perm 200
          code=$?
          set -e
          if [ "$code" = "1" ]; then echo "::error::selftest FAILED — refusing to publish"; exit 1; fi
          echo "selftest gate ok (exit $code)"

      - name: build sdist + wheel
        run: python3 -m pip install --upgrade build && python3 -m build

      - name: publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
